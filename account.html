<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#12181b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sawmill">
  <title>Akun — Sawmill</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-shell">
  <header class="auth-shell-top">
    <a href="./" class="auth-back-home">
      <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      <span class="lang-text" data-id="auth-back-home">← Beranda</span>
    </a>
    <button class="lang-btn" type="button" id="lang-toggle-btn">
      <i class="fa-solid fa-globe"></i>
      <span id="lang-btn-label">🇮🇩 ID / 日本語</span>
    </button>
  </header>
  <main class="auth-shell-main">
    <div class="pane-header">
      <h1><i class="fa-solid fa-user" style="color: var(--accent-amber);"></i> <span class="lang-text" data-id="account-title">Akun</span></h1>
      <p class="lang-text" data-id="account-sub">Kelola nama tampilan dan sesi masuk Anda.</p>
    </div>
    <div class="card auth-card">
      <div class="form-group">
        <label class="lang-text" data-id="auth-email">Email</label>
        <p class="auth-readonly" data-auth-email>—</p>
      </div>
      <form id="form-account">
        <div class="form-group">
          <label class="lang-text" for="account-display-name" data-id="auth-display-name">Nama tampilan</label>
          <input type="text" id="account-display-name" class="form-input" required autocomplete="nickname">
        </div>
        <button type="submit" class="btn-submit"><i class="fa-solid fa-floppy-disk"></i> <span class="lang-text" data-id="account-save">Simpan</span></button>
      </form>
      <p id="account-status" class="auth-status" aria-live="polite"></p>
      <div class="auth-logout-wrap">
        <button type="button" class="btn-secondary" id="btn-signout">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="lang-text" data-id="auth-signout">Keluar</span>
        </button>
      </div>
    </div>
  </main>
  <script src="translations.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="auth.js"></script>
  <script src="account-page.js"></script>
  <script src="pwa.js"></script>
</body>
</html>
